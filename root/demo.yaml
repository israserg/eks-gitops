# Application "demo": deploys the Helm chart stored in this repo at apps/demo/chart.
# apps/demo/chart is a COPY of chart/ from the eks-demo-app repo (kept in sync by hand for now).
# The chart says HOW to deploy; the values below say WHAT runs and with which settings.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/israserg/eks-gitops
    targetRevision: HEAD
    path: apps/demo/chart
    helm:
      # Environment-specific settings live here, not in the chart.
      valuesObject:
        # The HPA owns the replica count (replicaCount is ignored while enabled).
        autoscaling:
          enabled: true
          minReplicas: 1
          maxReplicas: 3
          targetCPUUtilizationPercentage: 60
        image:
          # The deploy knob: the image tag to run (from the eks-demo-app build).
          tag: 1.0.2-db27a22
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
