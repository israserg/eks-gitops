# metrics-server: collects pod CPU/memory from the kubelets and serves the Metrics API.
# Required by the HorizontalPodAutoscaler and by "kubectl top".
# Third-party software, so a Helm chart straight from its project repo (no chart copy here).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0 # app version 0.9.0
    helm:
      valuesObject:
        replicas: 1 # one is enough for training
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
